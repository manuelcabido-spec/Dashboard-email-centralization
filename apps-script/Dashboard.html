<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dealer Document Tracker</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --hairline: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --blue: #2a78d6;
    --good: #0ca30c;
    --good-text: #006300;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --hairline: #2c2c2a;
      --border: rgba(255,255,255,0.10);
      --blue: #3987e5;
      --good-text: #0ca30c;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    padding: 20px; max-width: 1200px; margin: 0 auto;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 16px; }
  header h1 { font-size: 20px; font-weight: 700; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  button, .btn {
    font: inherit; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--ink);
    padding: 7px 12px; text-decoration: none; display: inline-block;
  }
  button:hover, .btn:hover { border-color: var(--blue); }
  button.primary { background: var(--blue); color: #fff; border-color: transparent; }
  button:disabled { opacity: .5; cursor: wait; }
  button.small { padding: 3px 8px; font-size: 12px; border-radius: 6px; }

  /* Selector de campaña */
  .campana-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
  .campana-bar label { font-size: 13px; color: var(--ink-2); }
  select, input[type=search], input[type=text], textarea {
    font: inherit; font-size: 13px; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface); color: var(--ink);
  }
  #selCampana { max-width: 380px; }

  /* Tarjetas de campaña */
  .campanas { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .camp-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .camp-card.cerrada { opacity: .6; }
  .camp-card h3 { font-size: 14px; margin-bottom: 2px; }
  .camp-card .sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .camp-card .pct { font-weight: 700; font-size: 13px; }
  .camp-card .bar { display: flex; gap: 2px; height: 10px; border-radius: 4px; overflow: hidden; margin: 6px 0 10px; background: var(--hairline); }
  .camp-card .seg { min-width: 2px; }
  .camp-card .row { display: flex; gap: 6px; flex-wrap: wrap; }

  /* KPI tiles */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px 14px; cursor: pointer;
  }
  .tile:hover { border-color: var(--blue); }
  .tile .label { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .tile .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .tile .value { font-size: 26px; font-weight: 700; margin-top: 2px; }
  .tile.active { outline: 2px solid var(--blue); }

  /* Barra de progreso general */
  .dist { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 18px; }
  .dist .bar { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .dist .seg { min-width: 3px; }
  .dist .title { font-size: 12px; color: var(--ink-2); }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hairline); margin-bottom: 12px; }
  .tabs button { border: none; background: none; border-radius: 8px 8px 0 0; padding: 9px 14px; color: var(--ink-2); }
  .tabs button.active { color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--blue); }
  .tabs .count { background: var(--hairline); border-radius: 10px; font-size: 11px; padding: 1px 7px; margin-left: 4px; }

  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  input[type=search] { flex: 1; min-width: 180px; }

  /* Tabla */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; padding: 10px 12px; border-bottom: 1px solid var(--hairline); white-space: nowrap; }
  td { padding: 9px 12px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: rgba(42,120,214,0.05); }
  td.num { font-variant-numeric: tabular-nums; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 20px;
    border: 1px solid var(--border); white-space: nowrap;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; }
  a { color: var(--blue); }
  .empty { text-align: center; color: var(--muted); padding: 30px; }
  .followup { color: var(--critical); font-weight: 700; }

  /* Modales (nueva campaña, interacción, ticket, mensaje…) */
  #modal, .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 10;
    overflow-y: auto;
  }
  #modal.open, .overlay.open { display: flex; }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
  .checks label { display: inline-flex; align-items: center; gap: 5px; }
  .sec-title { font-size: 13px; font-weight: 700; color: var(--ink-2); padding: 12px 12px 6px; }
  .msg-text { white-space: pre-wrap; max-width: 480px; }
  .modal-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; width: 100%; max-width: 520px;
  }
  .modal-box h2 { font-size: 16px; margin-bottom: 14px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
  .field input[type=text], .field select, .field textarea { width: 100%; }
  .field .hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .field .radio { font-size: 13px; margin-right: 14px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

  /* Banner de aviso (errores / versión antigua) */
  #banner {
    display: none; background: var(--surface); border: 1px solid var(--critical);
    color: var(--critical); border-radius: 10px; padding: 10px 14px;
    font-size: 13px; font-weight: 600; margin-bottom: 14px;
  }

  /* Chips de la pestaña Dealers */
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 12px 4px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
    font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface);
  }
  .chip:hover { border-color: var(--blue); }
  .chip.active { outline: 2px solid var(--blue); }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; }
  .chip .n { color: var(--ink-2); font-weight: 700; }

  #toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--page); padding: 10px 18px;
    border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 20;
  }
  #toast.show { opacity: 1; }
  #loading { text-align: center; color: var(--muted); padding: 60px 0; }
</style>
</head>
<body>

<header>
  <h1>📋 Dealer CSM Hub</h1>
  <span class="meta" id="updated"></span>
  <span class="spacer"></span>
  <a class="btn" id="sheetLink" target="_blank" rel="noopener">Abrir Google Sheet</a>
  <button onclick="refrescar()">⟳ Actualizar datos</button>
  <button class="primary" onclick="abrirModalInt()">➕ Registrar interacción</button>
  <button id="btnScan" onclick="escanear()">🔄 Escanear correos</button>
</header>

<div id="banner"></div>
<div id="loading">Cargando datos…</div>

<div id="app" style="display:none">

  <div class="campana-bar">
    <label for="selCampana">Campaña:</label>
    <select id="selCampana" onchange="cambiarCampana(this.value)"></select>
    <button onclick="abrirModal()">➕ Nueva campaña</button>
    <button id="btnRequests" onclick="crearSolicitudes()">✉️ Borradores de solicitud</button>
  </div>

  <div class="campanas" id="campanas"></div>

  <div class="kpis" id="kpis"></div>

  <div class="dist">
    <div class="title" id="distTitle">Progreso</div>
    <div class="bar" id="distBar"></div>
  </div>

  <div class="tabs">
    <button id="tab-hoy" class="active" onclick="setTab('hoy')">📅 Hoy <span class="count" id="cnt-hoy"></span></button>
    <button id="tab-enablement" onclick="setTab('enablement')">🚀 Enablement <span class="count" id="cnt-enablement"></span></button>
    <button id="tab-tickets" onclick="setTab('tickets')">🎫 Tickets <span class="count" id="cnt-tickets"></span></button>
    <button id="tab-mensajes" onclick="setTab('mensajes')">✉️ Mensajes <span class="count" id="cnt-mensajes"></span></button>
    <button id="tab-findia" onclick="setTab('findia')">🌙 Fin de día <span class="count" id="cnt-findia"></span></button>
    <button id="tab-solicitudes" onclick="setTab('solicitudes')">Solicitudes <span class="count" id="cnt-solicitudes"></span></button>
    <button id="tab-dealers" onclick="setTab('dealers')">🏢 Dealers <span class="count" id="cnt-dealers"></span></button>
    <button id="tab-seguimiento" onclick="setTab('seguimiento')">⚠️ Seguimiento <span class="count" id="cnt-seguimiento"></span></button>
    <button id="tab-correos" onclick="setTab('correos')">Correos <span class="count" id="cnt-correos"></span></button>
  </div>

  <div class="filters" id="filters">
    <input type="search" id="search" placeholder="Buscar dealer o documento…" oninput="render()">
    <select id="filtroEstado" onchange="render()">
      <option value="">Todos los estados</option>
    </select>
    <label id="chkGestionadosWrap" style="display:none;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)">
      <input type="checkbox" id="chkGestionados" onchange="render()"> Ver gestionados
    </label>
  </div>

  <div class="card"><div id="content"></div></div>
</div>

<!-- Modal: nueva campaña -->
<div id="modal">
  <div class="modal-box">
    <h2>➕ Nueva campaña</h2>
    <div class="field">
      <label for="fNombre">Nombre de la campaña</label>
      <input type="text" id="fNombre" placeholder="Ej: Contratos de seguro - Jul 2026">
    </div>
    <div class="field">
      <label for="fDocumento">Documento que se solicita</label>
      <select id="fDocumento" onchange="toggleNuevoDoc()"></select>
    </div>
    <div class="field" id="fNuevoDocWrap" style="display:none">
      <label for="fNuevoDoc">Nombre del documento nuevo</label>
      <input type="text" id="fNuevoDoc" placeholder="Ej: Licencia de actividad">
      <label for="fKeywords" style="margin-top:8px">Palabras clave para detectarlo en los correos</label>
      <input type="text" id="fKeywords" placeholder="Ej: licencia, license, actividad">
      <div class="hint">Separadas por comas. Se buscan en el asunto, los adjuntos y el cuerpo del correo.</div>
    </div>
    <div class="field">
      <label>Dealers incluidos</label>
      <label class="radio"><input type="radio" name="fDealersModo" value="todos" checked onchange="toggleListaDealers()"> Todos (<span id="nDealers"></span>)</label>
      <label class="radio"><input type="radio" name="fDealersModo" value="lista" onchange="toggleListaDealers()"> Solo algunos</label>
      <textarea id="fDealersLista" rows="4" style="display:none;width:100%;margin-top:6px"
        placeholder="Un dealer por línea (con el mismo nombre que en la hoja Dealers)"></textarea>
    </div>
    <div class="field">
      <label for="fNotas">Notas (opcional)</label>
      <input type="text" id="fNotas">
    </div>
    <div class="modal-actions">
      <button onclick="cerrarModal()">Cancelar</button>
      <button class="primary" id="btnCrearCampana" onclick="enviarCampana()">Crear campaña</button>
    </div>
  </div>
</div>

<!-- Modal: registrar interacción (llamada / reunión / mensaje con un dealer) -->
<div id="modalInt" class="overlay">
  <div class="modal-box">
    <h2>➕ Registrar interacción</h2>
    <div class="field">
      <label for="iDealer">Dealer</label>
      <input type="text" id="iDealer" list="dlDealers" placeholder="Nombre del dealer">
      <datalist id="dlDealers"></datalist>
    </div>
    <div class="field" style="display:flex;gap:10px">
      <div style="flex:1">
        <label for="iTipo">Tipo</label>
        <select id="iTipo" style="width:100%"></select>
      </div>
      <div style="flex:1">
        <label for="iSegmento">Segmento</label>
        <select id="iSegmento" style="width:100%" onchange="toggleSegmento()"></select>
      </div>
    </div>
    <div class="field" id="iTipologiaWrap" style="display:none">
      <label for="iTipologia">Tipología del ticket</label>
      <select id="iTipologia" style="width:100%"></select>
    </div>
    <div class="field" id="iFeaturesWrap">
      <label>Features tratadas</label>
      <div id="iFeatures" class="checks"></div>
    </div>
    <div class="field">
      <label for="iResumen">Resumen (qué se ha hablado / cuál es el problema)</label>
      <textarea id="iResumen" rows="3" style="width:100%"></textarea>
    </div>
    <div class="field">
      <label for="iPendDealer">El dealer me debe pasar… (una cosa por línea → tareas + mensaje de follow-up)</label>
      <textarea id="iPendDealer" rows="3" style="width:100%" placeholder="Ej: Meta Business access&#10;Inventory credentials"></textarea>
    </div>
    <div class="field">
      <label for="iPendMios">Yo debo… (una cosa por línea → tareas mías)</label>
      <textarea id="iPendMios" rows="2" style="width:100%" placeholder="Ej: Ask about audit extension"></textarea>
    </div>
    <div class="field" style="display:flex;gap:10px">
      <div style="flex:1">
        <label for="iFechaLimite">Fecha límite (opcional)</label>
        <input type="date" id="iFechaLimite" style="width:100%">
      </div>
      <div style="flex:2">
        <label for="iNotas">Notas (opcional)</label>
        <input type="text" id="iNotas" style="width:100%">
      </div>
    </div>
    <div class="modal-actions">
      <button onclick="cerrarOverlay('modalInt')">Cancelar</button>
      <button class="primary" id="btnGuardarInt" onclick="guardarInteraccion()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: nuevo ticket de soporte -->
<div id="modalTicket" class="overlay">
  <div class="modal-box">
    <h2>🎫 Nuevo ticket</h2>
    <div class="field">
      <label for="tDealer">Dealer</label>
      <input type="text" id="tDealer" list="dlDealers" placeholder="Nombre del dealer">
    </div>
    <div class="field" style="display:flex;gap:10px">
      <div style="flex:1">
        <label for="tOrigen">Origen</label>
        <select id="tOrigen" style="width:100%">
          <option>HubSpot-WhatsApp</option><option>Slack</option><option>Email</option><option>Llamada</option>
        </select>
      </div>
      <div style="flex:1">
        <label for="tTipologia">Tipología</label>
        <select id="tTipologia" style="width:100%"></select>
      </div>
    </div>
    <div class="field">
      <label for="tDescripcion">Descripción del problema</label>
      <textarea id="tDescripcion" rows="4" style="width:100%"></textarea>
    </div>
    <div class="field">
      <label class="radio"><input type="checkbox" id="tPublicar" checked> Preparar mensaje para su canal de Slack (bandeja Mensajes)</label>
    </div>
    <div class="modal-actions">
      <button onclick="cerrarOverlay('modalTicket')">Cancelar</button>
      <button class="primary" id="btnGuardarTicket" onclick="guardarTicket()">Crear ticket</button>
    </div>
  </div>
</div>

<!-- Modal: revisar y enviar un mensaje -->
<div id="modalMsg" class="overlay">
  <div class="modal-box">
    <h2>✉️ Revisar mensaje</h2>
    <div class="field"><span class="hint" id="mMeta"></span></div>
    <div class="field">
      <textarea id="mTexto" rows="9" style="width:100%"></textarea>
    </div>
    <div class="modal-actions" style="justify-content:space-between;flex-wrap:wrap">
      <div style="display:flex;gap:8px">
        <button onclick="copiarTexto(document.getElementById('mTexto').value)">📋 Copiar</button>
        <button onclick="msgMarcarEnviado()">✔ Ya lo envié yo</button>
      </div>
      <div style="display:flex;gap:8px">
        <button onclick="cerrarOverlay('modalMsg')">Cerrar</button>
        <button class="primary" id="btnEnviarMsg" onclick="msgAprobarEnviar()">Enviar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: responder a un ticket -->
<div id="modalResp" class="overlay">
  <div class="modal-box">
    <h2>💬 Responder ticket</h2>
    <div class="field"><span class="hint" id="rMeta"></span></div>
    <div class="field">
      <textarea id="rTexto" rows="7" style="width:100%"></textarea>
    </div>
    <div class="modal-actions">
      <button onclick="cerrarOverlay('modalResp')">Cancelar</button>
      <button class="primary" id="btnGuardarResp" onclick="guardarRespuesta()">Guardar en Mensajes</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  // Debe coincidir con la constante VERSION de Code.gs: si difieren, la
  // implementación /exec está sirviendo una versión antigua del código.
  var VERSION = 5;

  var DATA = null;
  var TAB = 'hoy';
  var DOC_TABS = ['solicitudes', 'dealers', 'seguimiento', 'correos'];
  var CAMPANA_SEL = ''; // '' = todas
  var DEALER_FILTRO = ''; // filtro por estado en la pestaña Dealers
  var MSG_SEL = null;    // mensaje abierto en el modal de revisión
  var TICKET_SEL = null; // ticket abierto en el modal de respuesta
  var TICKET_FILTRO = ''; // filtro por estado en la pestaña Tickets

  var COLOR_SEGMENTO = {
    'Enablement': 'var(--good)',
    'Ticket': 'var(--critical)',
    'Website': 'var(--blue)',
    'Compliance': 'var(--serious)',
    'Otro': 'var(--muted)'
  };
  var COLOR_TICKET = {
    'Abierto': 'var(--critical)',
    'En curso': 'var(--blue)',
    'Esperando dealer': 'var(--warning)',
    'Resuelto': 'var(--good)'
  };
  var COLOR_MENSAJE = {
    'Borrador': 'var(--warning)',
    'Aprobado': 'var(--blue)',
    'Enviado': 'var(--good)'
  };

  var ESTADOS_DEALER = {
    INCORRECTO: '✖ Incorrecto - reenvío pedido',
    POR_REVISAR: '📥 Ha respondido - por revisar',
    SIN_CONTESTAR: '⏳ Sin contestar',
    COMPLETADO: '✔ Completado',
    SIN_SOLICITAR: 'Sin solicitar'
  };
  var COLOR_DEALER = {
    '✖ Incorrecto - reenvío pedido': 'var(--critical)',
    '📥 Ha respondido - por revisar': 'var(--warning)',
    '⏳ Sin contestar': 'var(--blue)',
    '✔ Completado': 'var(--good)',
    'Sin solicitar': 'var(--muted)'
  };

  var COLOR_ESTADO = {
    'Pendiente':               'var(--muted)',
    'Solicitado':              'var(--blue)',
    'Recibido - Por revisar':  'var(--warning)',
    'Verificado':              'var(--good)',
    'Incorrecto - Reenviar':   'var(--critical)'
  };
  var ICONO_ESTADO = {
    'Pendiente': '⏳', 'Solicitado': '📤', 'Recibido - Por revisar': '📥',
    'Verificado': '✔', 'Incorrecto - Reenviar': '✖'
  };
  var ORDEN_BARRA = ['Verificado', 'Recibido - Por revisar', 'Incorrecto - Reenviar', 'Solicitado', 'Pendiente'];

  function cargar() {
    google.script.run.withSuccessHandler(pintar).withFailureHandler(error).getDashboardData();
  }
  function refrescar() {
    toast('Actualizando…');
    cargar();
  }

  function banner(msg) {
    var b = document.getElementById('banner');
    b.style.display = msg ? '' : 'none';
    b.textContent = msg || '';
  }

  function pintar(data) {
    DATA = data;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = '';
    document.getElementById('updated').textContent = 'Actualizado: ' + data.actualizado;
    document.getElementById('sheetLink').href = data.urlSheet;

    if (data.version !== VERSION) {
      banner('⚠ Este dashboard está desactualizado (interfaz v' + VERSION + ', servidor v' + (data.version || '1') +
             '). En el editor de Apps Script: Implementar → Administrar implementaciones → ✏️ → Versión: "Nueva versión" → Implementar.');
    } else {
      banner('');
    }

    var selE = document.getElementById('filtroEstado');
    if (selE.options.length === 1) {
      Object.keys(COLOR_ESTADO).forEach(function (e) {
        var o = document.createElement('option'); o.value = e; o.textContent = e; selE.appendChild(o);
      });
    }
    pintarSelectorCampanas();
    poblarSelectoresCSM();
    render();
  }

  function pintarSelectorCampanas() {
    var sel = document.getElementById('selCampana');
    sel.innerHTML = '';
    var oTodas = document.createElement('option');
    oTodas.value = ''; oTodas.textContent = '🌐 Todas las campañas';
    sel.appendChild(oTodas);

    var activas = DATA.campanas.filter(function (c) { return c['Estado'] !== 'Cerrada'; });
    var cerradas = DATA.campanas.filter(function (c) { return c['Estado'] === 'Cerrada'; });
    activas.concat(cerradas).forEach(function (c) {
      var o = document.createElement('option');
      o.value = c['Nombre'];
      o.textContent = (c['Estado'] === 'Cerrada' ? '🔒 ' : '📂 ') + c['Nombre'] +
                      (c['Estado'] === 'Cerrada' ? ' (cerrada)' : '');
      sel.appendChild(o);
    });
    if (DATA.solicitudes.some(function (s) { return s['Campaña'] === '(sin campaña)'; })) {
      var o2 = document.createElement('option');
      o2.value = '(sin campaña)'; o2.textContent = '❔ (sin campaña)';
      sel.appendChild(o2);
    }
    sel.value = CAMPANA_SEL;
    if (sel.value !== CAMPANA_SEL) { CAMPANA_SEL = ''; sel.value = ''; }
  }

  function cambiarCampana(v) { CAMPANA_SEL = v; render(); }

  function solicitudesDeCampana(campana) {
    return DATA.solicitudes.filter(function (s) { return !campana || s['Campaña'] === campana; });
  }

  function kpisDe(filas) {
    var k = { total: filas.length, pendientes: 0, solicitadas: 0, recibidas: 0, verificadas: 0, incorrectas: 0, seguimientos: 0 };
    filas.forEach(function (s) {
      if (s['Estado'] === 'Pendiente') k.pendientes++;
      if (s['Estado'] === 'Solicitado') k.solicitadas++;
      if (s['Estado'] === 'Recibido - Por revisar') k.recibidas++;
      if (s['Estado'] === 'Verificado') k.verificadas++;
      if (s['Estado'] === 'Incorrecto - Reenviar') k.incorrectas++;
      if (s['Seguimiento'] === 'SÍ') k.seguimientos++;
    });
    return k;
  }

  function barraHtml(k) {
    var partes = [
      ['Verificado', k.verificadas], ['Recibido - Por revisar', k.recibidas],
      ['Incorrecto - Reenviar', k.incorrectas], ['Solicitado', k.solicitadas], ['Pendiente', k.pendientes]
    ];
    var total = Math.max(k.total, 1);
    return partes.map(function (p) {
      if (!p[1]) return '';
      return '<div class="seg" style="width:' + (100 * p[1] / total) + '%;background:' + COLOR_ESTADO[p[0]] + '" title="' + p[0] + ': ' + p[1] + '"></div>';
    }).join('');
  }

  function kpiTile(label, value, color, filtro) {
    var active = document.getElementById('filtroEstado').value === filtro && filtro !== '__seg__' ? ' active' : '';
    return '<div class="tile' + active + '" onclick="filtrarKpi(\'' + (filtro || '') + '\')">' +
      '<div class="label"><span class="dot" style="background:' + color + '"></span>' + label + '</div>' +
      '<div class="value">' + value + '</div></div>';
  }

  function filtrarKpi(estado) {
    if (estado === '__seg__') { setTab('seguimiento'); return; }
    var sel = document.getElementById('filtroEstado');
    sel.value = sel.value === estado ? '' : estado;
    setTab('solicitudes');
  }

  function render() {
    try {
      renderInterno();
    } catch (e) {
      banner('⚠ Error al pintar el dashboard: ' + e.message +
             '. Prueba a recargar la página; si persiste, publica una "Nueva versión" en Administrar implementaciones.');
    }
  }

  function renderInterno() {
    if (!DATA.interacciones) {
      // Servidor antiguo (v4): mostramos las pestañas de documentos y el banner de versión
      TAB = DOC_TABS.indexOf(TAB) !== -1 ? TAB : 'solicitudes';
      DATA.interacciones = []; DATA.tareas = []; DATA.tickets = [];
      DATA.mensajes = []; DATA.finDeDia = []; DATA.agendaHoy = [];
    }
    // Contadores de las pestañas CSM (visibles siempre)
    var intHoy = DATA.interacciones.filter(function (x) { return x['Fecha'] === DATA.hoy; });
    var ticketsAbiertos = DATA.tickets.filter(function (t) { return t['Estado'] !== 'Resuelto'; });
    var msgsPendientes = DATA.mensajes.filter(function (m) { return m['Estado'] !== 'Enviado'; });
    document.getElementById('cnt-hoy').textContent = intHoy.length;
    document.getElementById('cnt-enablement').textContent =
      DATA.interacciones.filter(function (x) { return x['Segmento'] === 'Enablement'; }).length;
    document.getElementById('cnt-tickets').textContent = ticketsAbiertos.length;
    document.getElementById('cnt-mensajes').textContent = msgsPendientes.length;
    document.getElementById('cnt-findia').textContent = DATA.finDeDia.length;

    // Las pestañas de documentos conservan su interfaz (campañas, KPIs, barra);
    // las pestañas CSM pintan la suya propia.
    var esDocs = DOC_TABS.indexOf(TAB) !== -1;
    document.querySelector('.campana-bar').style.display = esDocs ? '' : 'none';
    document.querySelector('.dist').style.display = esDocs ? '' : 'none';
    if (!esDocs) {
      document.getElementById('campanas').style.display = 'none';
      renderCSM(intHoy, ticketsAbiertos, msgsPendientes);
      return;
    }

    var filasCampana = solicitudesDeCampana(CAMPANA_SEL);
    var k = kpisDe(filasCampana);

    // Tarjetas de campaña (solo en la vista "Todas")
    var cont = document.getElementById('campanas');
    if (!CAMPANA_SEL && DATA.campanas.length) {
      cont.style.display = '';
      cont.innerHTML = DATA.campanas.map(function (c) {
        var kc = kpisDe(solicitudesDeCampana(c['Nombre']));
        var pct = kc.total ? Math.round(100 * kc.verificadas / kc.total) : 0;
        var cerrada = c['Estado'] === 'Cerrada';
        return '<div class="camp-card' + (cerrada ? ' cerrada' : '') + '">' +
          '<h3>' + esc(c['Nombre']) + '</h3>' +
          '<div class="sub">' + esc(c['Documento']) + ' · ' + esc(c['Fecha creación']) + ' · ' + kc.total + ' dealers' + (cerrada ? ' · 🔒 cerrada' : '') + '</div>' +
          '<span class="pct">' + pct + '% verificado</span>' +
          '<div class="bar">' + barraHtml(kc) + '</div>' +
          '<div class="row">' +
            '<button class="small" onclick="verCampana(\'' + escAttr(c['Nombre']) + '\')">Ver</button>' +
            (cerrada
              ? '<button class="small" onclick="reabrir(\'' + escAttr(c['Nombre']) + '\')">Reabrir</button>'
              : '<button class="small" onclick="borradoresCampana(\'' + escAttr(c['Nombre']) + '\')">✉️ Borradores</button>' +
                '<button class="small" onclick="cerrar(\'' + escAttr(c['Nombre']) + '\')">Cerrar</button>') +
          '</div></div>';
      }).join('');
    } else {
      cont.style.display = 'none';
    }

    document.getElementById('kpis').innerHTML =
      kpiTile('Pendientes', k.pendientes, 'var(--muted)', 'Pendiente') +
      kpiTile('Solicitadas', k.solicitadas, 'var(--blue)', 'Solicitado') +
      kpiTile('Por revisar', k.recibidas, 'var(--warning)', 'Recibido - Por revisar') +
      kpiTile('Incorrectas', k.incorrectas, 'var(--critical)', 'Incorrecto - Reenviar') +
      kpiTile('Verificadas', k.verificadas, 'var(--good)', 'Verificado') +
      kpiTile('⚠ Necesitan seguimiento', k.seguimientos, 'var(--serious)', '__seg__');

    document.getElementById('distTitle').textContent =
      (CAMPANA_SEL ? 'Progreso de "' + CAMPANA_SEL + '"' : 'Progreso general') +
      ' — ' + (k.total ? Math.round(100 * k.verificadas / Math.max(k.total, 1)) : 0) + '% verificado';
    document.getElementById('distBar').innerHTML = barraHtml(k);

    var seguimientos = filasCampana.filter(function (s) { return s['Seguimiento'] === 'SÍ'; });
    var correosPendientes = DATA.correos.filter(function (c) { return c['Estado'] !== 'Gestionado'; });
    var dealersResumen = resumenDealers(filasCampana);
    document.getElementById('cnt-solicitudes').textContent = filasCampana.length;
    document.getElementById('cnt-dealers').textContent = dealersResumen.length;
    document.getElementById('cnt-seguimiento').textContent = seguimientos.length;
    document.getElementById('cnt-correos').textContent = correosPendientes.length;

    var html = '';
    if (TAB === 'solicitudes') html = tablaSolicitudes(filtrar(filasCampana));
    if (TAB === 'dealers') html = vistaDealers(dealersResumen);
    if (TAB === 'seguimiento') html = tablaSolicitudes(filtrar(seguimientos));
    if (TAB === 'correos') {
      var verGestionados = document.getElementById('chkGestionados').checked;
      html = tablaCorreos(filtrar(verGestionados ? DATA.correos : correosPendientes));
    }
    document.getElementById('content').innerHTML = html;
    document.getElementById('filtroEstado').style.display =
      (TAB === 'correos' || TAB === 'dealers') ? 'none' : '';
    document.getElementById('chkGestionadosWrap').style.display = TAB === 'correos' ? 'flex' : 'none';
  }

  // ---- Pestaña Dealers: estado derivado por dealer ----
  function resumenDealers(filas) {
    var porDealer = {};
    filas.forEach(function (s) {
      (porDealer[s['Dealer']] = porDealer[s['Dealer']] || []).push(s);
    });
    // En la vista "Todas las campañas" mostramos también dealers sin solicitudes
    if (!CAMPANA_SEL) {
      DATA.dealers.forEach(function (d) {
        if (!porDealer[d.nombre]) porDealer[d.nombre] = [];
      });
    }
    var emails = {};
    DATA.dealers.forEach(function (d) { emails[d.nombre] = d.emails; });

    return Object.keys(porDealer).sort().map(function (nombre) {
      var rows = porDealer[nombre];
      var n = function (estado) { return rows.filter(function (r) { return r['Estado'] === estado; }).length; };
      var estado;
      if (!rows.length) estado = ESTADOS_DEALER.SIN_SOLICITAR;
      else if (n('Incorrecto - Reenviar')) estado = ESTADOS_DEALER.INCORRECTO;
      else if (n('Recibido - Por revisar')) estado = ESTADOS_DEALER.POR_REVISAR;
      else if (n('Solicitado')) estado = ESTADOS_DEALER.SIN_CONTESTAR;
      else if (n('Verificado') === rows.length) estado = ESTADOS_DEALER.COMPLETADO;
      else estado = ESTADOS_DEALER.SIN_SOLICITAR;

      var ultimo = rows.map(function (r) { return String(r['Último contacto'] || ''); })
        .filter(Boolean)
        .sort(function (a, b) { return claveFecha(a) < claveFecha(b) ? 1 : -1; })[0] || '';
      var link = rows.map(function (r) { return r['Link correo']; }).filter(Boolean).pop() || '';

      return {
        dealer: nombre,
        email: emails[nombre] || '',
        estado: estado,
        verificados: n('Verificado'),
        total: rows.length,
        ultimo: ultimo,
        link: link
      };
    });
  }
  function claveFecha(ddmmyyyy) {
    var p = ddmmyyyy.split('/');
    return p.length === 3 ? p[2] + p[1] + p[0] : '';
  }

  function vistaDealers(resumen) {
    var orden = [ESTADOS_DEALER.INCORRECTO, ESTADOS_DEALER.POR_REVISAR, ESTADOS_DEALER.SIN_CONTESTAR,
                 ESTADOS_DEALER.COMPLETADO, ESTADOS_DEALER.SIN_SOLICITAR];
    var chips = orden.map(function (e) {
      var cuantos = resumen.filter(function (d) { return d.estado === e; }).length;
      var active = DEALER_FILTRO === e ? ' active' : '';
      return '<span class="chip' + active + '" onclick="filtrarDealer(\'' + escAttr(e) + '\')">' +
        '<span class="dot" style="background:' + COLOR_DEALER[e] + '"></span>' +
        esc(e) + ' <span class="n">' + cuantos + '</span></span>';
    }).join('');

    var q = document.getElementById('search').value.toLowerCase();
    var filas = resumen.filter(function (d) {
      if (DEALER_FILTRO && d.estado !== DEALER_FILTRO) return false;
      if (!q) return true;
      return (d.dealer + ' ' + d.email + ' ' + d.estado).toLowerCase().indexOf(q) !== -1;
    });

    var h = '<div class="chips">' + chips + '</div>';
    if (!filas.length) return h + '<div class="empty">No hay dealers que coincidan.</div>';

    h += '<table><tr><th>Dealer</th><th>Email</th><th>Docs ✔</th><th>Estado</th><th>Último contacto</th><th>Correo</th></tr>';
    var ordenIdx = {};
    orden.forEach(function (e, i) { ordenIdx[e] = i; });
    filas.sort(function (a, b) { return ordenIdx[a.estado] - ordenIdx[b.estado] || (a.dealer > b.dealer ? 1 : -1); });
    filas.forEach(function (d) {
      h += '<tr><td>' + esc(d.dealer) + '</td>' +
        '<td>' + esc(d.email || '—') + '</td>' +
        '<td class="num">' + d.verificados + '/' + d.total + '</td>' +
        '<td><span class="badge"><span class="dot" style="background:' + COLOR_DEALER[d.estado] + '"></span>' + esc(d.estado) + '</span></td>' +
        '<td>' + esc(d.ultimo || '—') + '</td>' +
        '<td>' + linkCorreo(d.link) + '</td></tr>';
    });
    return h + '</table>';
  }
  function filtrarDealer(estado) {
    DEALER_FILTRO = DEALER_FILTRO === estado ? '' : estado;
    render();
  }
  function linkCorreo(url) {
    return url
      ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">✉️ Abrir</a>'
      : '<span style="color:var(--muted)">—</span>';
  }

  function filtrar(filas) {
    var q = document.getElementById('search').value.toLowerCase();
    var estado = document.getElementById('filtroEstado').value;
    return filas.filter(function (f) {
      if (TAB !== 'correos' && estado && f['Estado'] !== estado) return false;
      if (!q) return true;
      return Object.keys(f).some(function (k) { return String(f[k]).toLowerCase().indexOf(q) !== -1; });
    });
  }

  function badge(estado) {
    var c = COLOR_ESTADO[estado] || 'var(--muted)';
    return '<span class="badge"><span class="dot" style="background:' + c + '"></span>' +
      (ICONO_ESTADO[estado] || '') + ' ' + esc(estado) + '</span>';
  }

  function tablaSolicitudes(filas) {
    if (!filas.length) return '<div class="empty">No hay solicitudes que coincidan.</div>';
    var conCampana = !CAMPANA_SEL;
    var h = '<table><tr><th>Dealer</th><th>Documento</th>' +
            (conCampana ? '<th>Campaña</th>' : '') +
            '<th>Estado</th><th>Último contacto</th><th>Días</th><th>Correo</th><th>Archivo</th><th>Acciones</th></tr>';
    filas.forEach(function (s) {
      var dias = s['Días sin respuesta'];
      var archivo = s['Archivo (Drive)']
        ? String(s['Archivo (Drive)']).split('\n').map(function (u, i) {
            return '<a href="' + esc(u) + '" target="_blank" rel="noopener">Ver archivo ' + (i + 1) + '</a>';
          }).join('<br>')
        : '<span style="color:var(--muted)">—</span>';
      var seg = s['Seguimiento'] === 'SÍ' ? ' <span class="followup">⚠</span>' : '';
      h += '<tr><td>' + esc(s['Dealer']) + '</td><td>' + esc(s['Documento']) + '</td>' +
        (conCampana ? '<td>' + esc(s['Campaña'] || '') + '</td>' : '') +
        '<td>' + badge(s['Estado']) + seg + '</td>' +
        '<td>' + esc(s['Último contacto'] || '—') + '</td>' +
        '<td class="num">' + (dias === '' ? '—' : dias) + '</td>' +
        '<td>' + linkCorreo(s['Link correo']) + '</td>' +
        '<td>' + archivo + '</td>' +
        '<td style="white-space:nowrap">' + acciones(s) + '</td></tr>';
    });
    return h + '</table>';
  }

  function acciones(s) {
    var id = esc(s['ID']);
    var a = '';
    if (s['Estado'] === 'Recibido - Por revisar') {
      a += '<button class="small" onclick="verificar(\'' + id + '\')">✔ Correcto</button> ' +
           '<button class="small" onclick="incorrecto(\'' + id + '\')">✖ Incorrecto</button>';
    } else if (s['Estado'] === 'Solicitado' || s['Estado'] === 'Incorrecto - Reenviar') {
      a += '<button class="small" onclick="seguimiento(\'' + id + '\')">✉️ Seguimiento</button>';
    } else if (s['Estado'] === 'Verificado') {
      a += '<span style="color:var(--good-text);font-weight:600">Completado</span>';
    }
    return a;
  }

  function tablaCorreos(filas) {
    if (!filas.length) {
      return '<div class="empty">No hay correos pendientes de gestionar. ' +
             'Marca «Ver gestionados» para ver el histórico, o pulsa «Escanear correos ahora».</div>';
    }
    var h = '<table><tr><th>Fecha</th><th>Dealer</th><th>Asunto</th><th>Documento</th><th>Adjuntos</th><th>Gmail</th><th>Estado</th><th></th></tr>';
    filas.forEach(function (c) {
      var gestionado = c['Estado'] === 'Gestionado';
      h += '<tr' + (gestionado ? ' style="opacity:.55"' : '') + '>' +
        '<td class="num">' + esc(c['Fecha']) + '</td>' +
        '<td>' + esc(c['Dealer']) + '</td>' +
        '<td>' + esc(c['Asunto'] || '(sin asunto)') + '</td>' +
        '<td>' + esc(c['Documento detectado']) + '</td>' +
        '<td>' + esc(c['Adjuntos'] || '—') + '</td>' +
        '<td>' + linkCorreo(c['Link Gmail']) + '</td>' +
        '<td>' + esc(c['Estado']) + '</td>' +
        '<td>' + (gestionado ? '' : '<button class="small" onclick="gestionado(\'' + esc(c['MessageId']) + '\')">Marcar gestionado</button>') + '</td></tr>';
    });
    return h + '</table>';
  }

  function setTab(t) {
    TAB = t;
    ['hoy', 'enablement', 'tickets', 'mensajes', 'findia',
     'solicitudes', 'dealers', 'seguimiento', 'correos'].forEach(function (x) {
      document.getElementById('tab-' + x).classList.toggle('active', x === t);
    });
    render();
  }

  // ---- Campañas ----
  function verCampana(nombre) {
    CAMPANA_SEL = nombre;
    document.getElementById('selCampana').value = nombre;
    render();
  }
  function cerrar(nombre) {
    if (!confirm('¿Cerrar la campaña "' + nombre + '"? Sus solicitudes dejarán de generar seguimientos.')) return;
    llamar('cerrarCampana', [nombre], 'Campaña cerrada 🔒');
  }
  function reabrir(nombre) { llamar('reabrirCampana', [nombre], 'Campaña reabierta 📂'); }
  function borradoresCampana(nombre) {
    if (!confirm('Se crearán borradores en Gmail para los documentos "Pendientes" de la campaña "' + nombre + '". ¿Continuar?')) return;
    crearSolicitudesServidor(nombre);
  }

  function abrirModal() {
    var sel = document.getElementById('fDocumento');
    sel.innerHTML = '';
    DATA.tiposDocumento.forEach(function (t) {
      var o = document.createElement('option'); o.value = t; o.textContent = t; sel.appendChild(o);
    });
    var oNuevo = document.createElement('option');
    oNuevo.value = '__nuevo__'; oNuevo.textContent = '➕ Documento nuevo…';
    sel.appendChild(oNuevo);
    document.getElementById('nDealers').textContent = DATA.dealers.length;
    toggleNuevoDoc();
    document.getElementById('modal').classList.add('open');
  }
  function cerrarModal() { document.getElementById('modal').classList.remove('open'); }
  function toggleNuevoDoc() {
    var esNuevo = document.getElementById('fDocumento').value === '__nuevo__';
    document.getElementById('fNuevoDocWrap').style.display = esNuevo ? '' : 'none';
  }
  function toggleListaDealers() {
    var modo = document.querySelector('input[name=fDealersModo]:checked').value;
    document.getElementById('fDealersLista').style.display = modo === 'lista' ? '' : 'none';
  }

  function enviarCampana() {
    var esNuevo = document.getElementById('fDocumento').value === '__nuevo__';
    var datos = {
      nombre: document.getElementById('fNombre').value,
      documento: esNuevo ? document.getElementById('fNuevoDoc').value : document.getElementById('fDocumento').value,
      palabrasClave: esNuevo ? document.getElementById('fKeywords').value : '',
      dealersModo: document.querySelector('input[name=fDealersModo]:checked').value,
      dealersLista: document.getElementById('fDealersLista').value,
      notas: document.getElementById('fNotas').value
    };
    if (!datos.nombre.trim()) { toast('Ponle un nombre a la campaña'); return; }
    if (!datos.documento.trim()) { toast('Indica el documento que se solicita'); return; }

    var btn = document.getElementById('btnCrearCampana');
    btn.disabled = true;
    google.script.run.withSuccessHandler(function (data) {
      btn.disabled = false;
      cerrarModal();
      CAMPANA_SEL = datos.nombre.trim();
      pintar(data);
      toast('Campaña creada ✔ Ahora puedes generar los borradores de solicitud.');
    }).withFailureHandler(function (e) {
      btn.disabled = false; error(e);
    }).crearCampana(datos);
  }

  // ---- Acciones contra el servidor ----
  function llamar(fn, args, mensaje) {
    toast('Trabajando…');
    var runner = google.script.run.withSuccessHandler(function (data) {
      pintar(data.data || data);
      toast(mensaje);
    }).withFailureHandler(error);
    runner[fn].apply(runner, args || []);
  }
  function verificar(id) { llamar('marcarVerificado', [id], 'Documento verificado ✔'); }
  function incorrecto(id) {
    var motivo = prompt('¿Por qué es incorrecto? (se incluirá en el borrador de respuesta)');
    if (motivo === null) return;
    llamar('marcarIncorrecto', [id, motivo], 'Marcado como incorrecto. Borrador creado en Gmail ✉️');
  }
  function seguimiento(id) { llamar('crearBorradorSeguimiento', [id], 'Borrador de seguimiento creado en Gmail ✉️'); }
  function gestionado(msgId) { llamar('marcarCorreoGestionado', [msgId], 'Correo marcado como gestionado'); }

  function escanear() {
    document.getElementById('btnScan').disabled = true;
    toast('Escaneando Gmail…');
    google.script.run.withSuccessHandler(function (data) {
      document.getElementById('btnScan').disabled = false;
      pintar(data); toast('Escaneo completado ✔');
    }).withFailureHandler(function (e) {
      document.getElementById('btnScan').disabled = false; error(e);
    }).escanearAhora();
  }

  function crearSolicitudes() {
    var ambito = CAMPANA_SEL ? 'la campaña "' + CAMPANA_SEL + '"' : 'TODAS las campañas';
    if (!confirm('Se crearán borradores en Gmail para los documentos en estado "Pendiente" de ' + ambito + ', agrupados por dealer. ¿Continuar?')) return;
    crearSolicitudesServidor(CAMPANA_SEL || null);
  }
  function crearSolicitudesServidor(campana) {
    var btn = document.getElementById('btnRequests');
    btn.disabled = true;
    google.script.run.withSuccessHandler(function (r) {
      btn.disabled = false;
      pintar(r.data); toast(r.borradores + ' borradores creados en Gmail ✉️');
    }).withFailureHandler(function (e) {
      btn.disabled = false; error(e);
    }).crearSolicitudesIniciales(campana);
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 3500);
  }
  function error(e) {
    document.getElementById('loading').textContent = '';
    toast('Error: ' + (e && e.message ? e.message : e));
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  // Para nombres dentro de onclick="fn('…')": primero se escapa para JS, luego para HTML
  function escAttr(s) {
    return esc(String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/'/g, "\\'"));
  }

  // ============================================================
  //  MÓDULO CSM: Hoy / Enablement / Tickets / Mensajes / Fin de día
  // ============================================================

  function renderCSM(intHoy, ticketsAbiertos, msgsPendientes) {
    document.getElementById('filtroEstado').style.display = 'none';
    document.getElementById('chkGestionadosWrap').style.display = 'none';

    var tareasPend = DATA.tareas.filter(function (t) { return t['Estado'] !== 'Hecho'; });
    document.getElementById('kpis').innerHTML =
      kpiCSM('Interacciones hoy', intHoy.length, 'var(--blue)', 'hoy') +
      kpiCSM('Tickets abiertos', ticketsAbiertos.length, 'var(--critical)', 'tickets') +
      kpiCSM('Mensajes por revisar', msgsPendientes.length, 'var(--warning)', 'mensajes') +
      kpiCSM('Me deben (dealers)', tareasPend.filter(function (t) { return t['Quién'] === 'Dealer'; }).length, 'var(--serious)', 'hoy') +
      kpiCSM('Debo yo', tareasPend.filter(function (t) { return t['Quién'] === 'Yo'; }).length, 'var(--good)', 'hoy') +
      kpiCSM('Notion pendiente hoy', DATA.finDeDia.length, 'var(--muted)', 'findia');

    var html = '';
    if (TAB === 'hoy') html = vistaHoy(intHoy, tareasPend);
    if (TAB === 'enablement') html = vistaEnablement(tareasPend);
    if (TAB === 'tickets') html = vistaTickets();
    if (TAB === 'mensajes') html = vistaMensajes();
    if (TAB === 'findia') html = vistaFinDia();
    document.getElementById('content').innerHTML = html;
  }

  function kpiCSM(label, value, color, tab) {
    return '<div class="tile" onclick="setTab(\'' + tab + '\')">' +
      '<div class="label"><span class="dot" style="background:' + color + '"></span>' + label + '</div>' +
      '<div class="value">' + value + '</div></div>';
  }

  function badgeColor(texto, mapa) {
    var c = mapa[texto] || 'var(--muted)';
    return '<span class="badge"><span class="dot" style="background:' + c + '"></span>' + esc(texto || '—') + '</span>';
  }

  function filtraTexto(filas) {
    var q = document.getElementById('search').value.toLowerCase();
    if (!q) return filas;
    return filas.filter(function (f) {
      return Object.keys(f).some(function (k) { return String(f[k]).toLowerCase().indexOf(q) !== -1; });
    });
  }

  // ---- 📅 Hoy ----
  function vistaHoy(intHoy, tareasPend) {
    var h = '<div class="sec-title">📆 Agenda de hoy</div>';
    if (!DATA.agendaHoy.length) {
      h += '<div class="empty">Sin eventos hoy en Google Calendar (si debería haberlos, re-ejecuta setup() y autoriza Calendar).</div>';
    } else {
      h += '<table><tr><th>Hora</th><th>Reunión</th><th>Dealer</th><th></th></tr>';
      DATA.agendaHoy.forEach(function (e) {
        h += '<tr><td class="num">' + esc(e.hora) + '</td><td>' + esc(e.titulo) + '</td>' +
          '<td>' + esc(e.dealer || '—') + '</td>' +
          '<td><button class="small" onclick="abrirModalInt(\'' + escAttr(e.dealer || '') + '\')">➕ Registrar</button></td></tr>';
      });
      h += '</table>';
    }
    h += '<div class="sec-title">🗣 Interacciones de hoy</div>' + tablaInteracciones(filtraTexto(intHoy));
    h += '<div class="sec-title">📌 Tareas pendientes</div>' + tablaTareas(filtraTexto(tareasPend));
    return h;
  }

  function tablaInteracciones(filas) {
    if (!filas.length) return '<div class="empty">Nada registrado aún. Usa «➕ Registrar interacción».</div>';
    var h = '<table><tr><th>Fecha</th><th>Dealer</th><th>Tipo</th><th>Segmento</th><th>Features</th><th>Resumen</th><th>Acuerdos</th><th>Notion</th></tr>';
    filas.forEach(function (x) {
      h += '<tr><td class="num">' + esc(x['Fecha']) + '</td><td>' + esc(x['Dealer']) + '</td>' +
        '<td>' + esc(x['Tipo']) + '</td>' +
        '<td>' + badgeColor(x['Segmento'], COLOR_SEGMENTO) + '</td>' +
        '<td>' + esc(x['Features'] || '—') + '</td>' +
        '<td class="msg-text">' + esc(x['Resumen']) + '</td>' +
        '<td class="msg-text">' + esc(x['Acuerdos'] || '—') + '</td>' +
        '<td>' + (x['Segmento'] === 'Enablement'
                    ? (x['Estado Notion'] === 'Sincronizado' ? '✔' : '⏳ ' + esc(x['Estado Notion']))
                    : '—') + '</td></tr>';
    });
    return h + '</table>';
  }

  function tablaTareas(filas) {
    if (!filas.length) return '<div class="empty">🎉 Sin tareas pendientes.</div>';
    var h = '<table><tr><th>Dealer</th><th>Quién</th><th>Descripción</th><th>Segmento</th><th>Límite</th><th></th></tr>';
    filas.forEach(function (t) {
      h += '<tr><td>' + esc(t['Dealer']) + '</td>' +
        '<td>' + (t['Quién'] === 'Dealer' ? '📥 Dealer' : '🙋 Yo') + '</td>' +
        '<td>' + esc(t['Descripción']) + '</td>' +
        '<td>' + badgeColor(t['Segmento'], COLOR_SEGMENTO) + '</td>' +
        '<td class="num">' + esc(t['Fecha límite'] || '—') + '</td>' +
        '<td><button class="small" onclick="tareaHecha(\'' + escAttr(t['ID']) + '\')">✔ Hecha</button></td></tr>';
    });
    return h + '</table>';
  }

  // ---- 🚀 Enablement ----
  function vistaEnablement(tareasPend) {
    var filas = filtraTexto(DATA.interacciones.filter(function (x) { return x['Segmento'] === 'Enablement'; }));
    var h = '<div class="sec-title">Historial de enablement (el update diario de Notion se compone en 🌙 Fin de día)</div>';
    h += tablaInteracciones(filas);
    var tareas = filtraTexto(tareasPend.filter(function (t) { return t['Segmento'] === 'Enablement'; }));
    h += '<div class="sec-title">📌 Pendientes de enablement</div>' + tablaTareas(tareas);
    return h;
  }

  // ---- 🎫 Tickets ----
  function vistaTickets() {
    var estados = ['Abierto', 'En curso', 'Esperando dealer', 'Resuelto'];
    var chips = estados.map(function (e) {
      var n = DATA.tickets.filter(function (t) { return t['Estado'] === e; }).length;
      var active = TICKET_FILTRO === e ? ' active' : '';
      return '<span class="chip' + active + '" onclick="filtrarTicket(\'' + escAttr(e) + '\')">' +
        '<span class="dot" style="background:' + COLOR_TICKET[e] + '"></span>' + esc(e) +
        ' <span class="n">' + n + '</span></span>';
    }).join('');

    var filas = filtraTexto(DATA.tickets.filter(function (t) {
      return !TICKET_FILTRO ? t['Estado'] !== 'Resuelto' : t['Estado'] === TICKET_FILTRO;
    }));

    var h = '<div class="chips">' + chips +
      '<span class="spacer" style="flex:1"></span>' +
      '<button class="small" onclick="abrirModalTicket()">➕ Nuevo ticket</button></div>';
    if (!filas.length) return h + '<div class="empty">No hay tickets' + (TICKET_FILTRO ? ' en "' + esc(TICKET_FILTRO) + '"' : ' abiertos') + '.</div>';

    h += '<table><tr><th>Fecha</th><th>Dealer</th><th>Tipología</th><th>Canal</th><th>Descripción</th><th>Estado</th><th>Últ. act.</th><th>Acciones</th></tr>';
    filas.forEach(function (t) {
      var id = escAttr(t['ID']);
      h += '<tr><td class="num">' + esc(t['Fecha']) + '</td><td>' + esc(t['Dealer']) + '</td>' +
        '<td>' + esc(t['Tipología']) + '</td>' +
        '<td>#' + esc(t['Canal Slack']) + '</td>' +
        '<td class="msg-text">' + esc(t['Descripción']) + (t['Notas'] ? '<br><span style="color:var(--muted)">📝 ' + esc(t['Notas']) + '</span>' : '') + '</td>' +
        '<td>' + badgeColor(t['Estado'], COLOR_TICKET) + '</td>' +
        '<td class="num">' + esc(t['Última actualización'] || '—') + '</td>' +
        '<td style="white-space:nowrap">' +
          '<button class="small" onclick="abrirResp(\'' + id + '\')">💬 Responder</button> ' +
          (t['Estado'] !== 'Esperando dealer' ? '<button class="small" title="Esperando al dealer" onclick="estadoTicket(\'' + id + '\',\'Esperando dealer\')">⏳</button> ' : '') +
          (t['Estado'] !== 'Resuelto' ? '<button class="small" title="Marcar resuelto" onclick="estadoTicket(\'' + id + '\',\'Resuelto\')">✔</button> ' : '') +
          '<button class="small" title="Añadir nota" onclick="notaTicket(\'' + id + '\')">📝</button>' +
        '</td></tr>';
    });
    return h + '</table>';
  }
  function filtrarTicket(e) { TICKET_FILTRO = TICKET_FILTRO === e ? '' : e; render(); }

  // ---- ✉️ Mensajes ----
  function vistaMensajes() {
    var pendientes = filtraTexto(DATA.mensajes.filter(function (m) { return m['Estado'] !== 'Enviado'; }));
    var enviados = filtraTexto(DATA.mensajes.filter(function (m) { return m['Estado'] === 'Enviado'; }));

    var h = '<div class="sec-title">Por revisar y enviar' +
      (DATA.slackOk ? '' : ' <span style="font-weight:400;color:var(--muted)">(sin token de Slack: revisa, copia y pega — o configura SLACK_BOT_TOKEN en Config)</span>') +
      '</div>';
    h += tablaMensajes(pendientes, true);
    h += '<div class="sec-title">Enviados</div>' + tablaMensajes(enviados.slice(0, 30), false);
    return h;
  }

  function tablaMensajes(filas, conAcciones) {
    if (!filas.length) return '<div class="empty">' + (conAcciones ? 'Nada pendiente de revisar. 🎉' : 'Todavía no hay mensajes enviados.') + '</div>';
    var h = '<table><tr><th>Fecha</th><th>Destino</th><th>Relacionado</th><th>Mensaje</th><th>Estado</th><th>Respuestas</th><th></th></tr>';
    filas.forEach(function (m) {
      var texto = String(m['Texto (EN)'] || '');
      var corto = texto.length > 140 ? texto.slice(0, 140) + '…' : texto;
      h += '<tr><td class="num">' + esc(m['Fecha']) + '</td>' +
        '<td>' + esc(m['Destino']) + '</td>' +
        '<td>' + esc(m['Relacionado']) + '</td>' +
        '<td class="msg-text">' + esc(corto) + '</td>' +
        '<td>' + badgeColor(m['Estado'], COLOR_MENSAJE) + (m['Enviado'] ? '<br><span style="color:var(--muted);font-size:11px">' + esc(m['Enviado']) + '</span>' : '') + '</td>' +
        '<td>' + esc(m['Respuestas'] || '—') + '</td>' +
        '<td style="white-space:nowrap">' +
          '<button class="small" onclick="abrirMsg(\'' + escAttr(m['ID']) + '\')">' + (conAcciones ? '✏️ Revisar y enviar' : '👁 Ver') + '</button>' +
        '</td></tr>';
    });
    return h + '</table>';
  }

  // ---- 🌙 Fin de día ----
  function vistaFinDia() {
    if (!DATA.finDeDia.length) {
      return '<div class="empty">🎉 No hay updates de Notion pendientes de hoy.<br>' +
        '<span style="font-size:12px">Se componen con las interacciones de segmento «Enablement» registradas hoy.</span></div>';
    }
    var h = '<div class="sec-title">Updates de hoy para el Summer Enablement Tracker — edítalos y sincroniza (o copia y pega en Notion)</div>';
    DATA.finDeDia.forEach(function (u, i) {
      h += '<div style="padding:10px 12px;border-bottom:1px solid var(--hairline)">' +
        '<div style="font-weight:700;margin-bottom:6px">' + esc(u.dealer) + '</div>' +
        '<textarea id="fd-' + i + '" rows="3" style="width:100%">' + esc(u.comentario) + '</textarea></div>';
    });
    h += '<div style="padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">';
    if (DATA.notionOk) {
      h += '<button class="primary" onclick="sincronizarNotion()">🔄 Sincronizar con Notion</button>';
    }
    h += '<button onclick="copiarFinDia()">📋 Copiar todo</button>' +
         '<button onclick="marcarFinDia()">✔ Marcar como actualizado</button>';
    if (!DATA.notionOk) {
      h += '<span style="font-size:12px;color:var(--muted)">Pega NOTION_TOKEN en la hoja Config para escribir en Notion automáticamente.</span>';
    }
    h += '</div>';
    return h;
  }

  function updatesFinDia() {
    return DATA.finDeDia.map(function (u, i) {
      var caja = document.getElementById('fd-' + i);
      return { dealer: u.dealer, comentario: caja ? caja.value.trim() : u.comentario, ids: u.ids };
    }).filter(function (u) { return u.comentario; });
  }
  function sincronizarNotion() {
    var updates = updatesFinDia();
    if (!updates.length) { toast('No hay nada que sincronizar'); return; }
    toast('Sincronizando con Notion…');
    google.script.run.withSuccessHandler(function (r) {
      pintar(r.data);
      toast(r.errores.length ? '⚠ Con errores: ' + r.errores.join(' · ') : 'Notion actualizado ✔');
    }).withFailureHandler(error).sincronizarFinDeDia(updates);
  }
  function copiarFinDia() {
    var texto = updatesFinDia().map(function (u) { return u.dealer + '\n' + u.comentario; }).join('\n\n---\n\n');
    copiarTexto(texto);
  }
  function marcarFinDia() {
    if (!confirm('¿Marcar los updates de hoy como ya reflejados en Notion?')) return;
    var ids = [];
    DATA.finDeDia.forEach(function (u) { ids = ids.concat(u.ids); });
    llamar('marcarFinDeDiaSincronizado', [ids], 'Marcado como actualizado ✔');
  }

  // ---- Modales y acciones CSM ----
  function poblarSelectoresCSM() {
    if (!DATA.tiposInteraccion) return; // servidor antiguo: el banner de versión ya avisa
    var dl = document.getElementById('dlDealers');
    dl.innerHTML = '';
    DATA.dealers.forEach(function (d) {
      var o = document.createElement('option'); o.value = d.nombre; dl.appendChild(o);
    });
    llenarSelect('iTipo', DATA.tiposInteraccion);
    llenarSelect('iSegmento', DATA.segmentos);
    var tipologias = DATA.tipologias.map(function (t) { return t.tipologia; });
    llenarSelect('iTipologia', tipologias);
    llenarSelect('tTipologia', tipologias);
    document.getElementById('iFeatures').innerHTML = DATA.features.map(function (f) {
      return '<label><input type="checkbox" value="' + escAttr(f) + '"> ' + esc(f) + '</label>';
    }).join('');
  }
  function llenarSelect(id, valores) {
    var sel = document.getElementById(id);
    sel.innerHTML = '';
    (valores || []).forEach(function (v) {
      var o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o);
    });
  }
  function abrirOverlay(id) { document.getElementById(id).classList.add('open'); }
  function cerrarOverlay(id) { document.getElementById(id).classList.remove('open'); }

  function abrirModalInt(dealer) {
    if (!DATA) return;
    document.getElementById('iDealer').value = dealer || '';
    document.getElementById('iResumen').value = '';
    document.getElementById('iPendDealer').value = '';
    document.getElementById('iPendMios').value = '';
    document.getElementById('iFechaLimite').value = '';
    document.getElementById('iNotas').value = '';
    document.querySelectorAll('#iFeatures input').forEach(function (c) { c.checked = false; });
    toggleSegmento();
    abrirOverlay('modalInt');
  }
  function toggleSegmento() {
    var seg = document.getElementById('iSegmento').value;
    document.getElementById('iTipologiaWrap').style.display = seg === 'Ticket' ? '' : 'none';
    document.getElementById('iFeaturesWrap').style.display = seg === 'Enablement' ? '' : 'none';
  }
  function guardarInteraccion() {
    var datos = {
      dealer: document.getElementById('iDealer').value,
      tipo: document.getElementById('iTipo').value,
      segmento: document.getElementById('iSegmento').value,
      tipologia: document.getElementById('iTipologia').value,
      features: Array.prototype.slice.call(document.querySelectorAll('#iFeatures input:checked'))
        .map(function (c) { return c.value; }),
      resumen: document.getElementById('iResumen').value,
      pendientesDealer: document.getElementById('iPendDealer').value,
      pendientesMios: document.getElementById('iPendMios').value,
      fechaLimite: document.getElementById('iFechaLimite').value,
      notas: document.getElementById('iNotas').value
    };
    if (!datos.dealer.trim()) { toast('Indica el dealer'); return; }
    if (!datos.resumen.trim()) { toast('Escribe un resumen'); return; }
    var btn = document.getElementById('btnGuardarInt');
    btn.disabled = true;
    google.script.run.withSuccessHandler(function (data) {
      btn.disabled = false;
      cerrarOverlay('modalInt');
      pintar(data);
      toast('Interacción registrada ✔ Revisa la pestaña Mensajes si generó borradores.');
    }).withFailureHandler(function (e) { btn.disabled = false; error(e); }).registrarInteraccion(datos);
  }

  function abrirModalTicket() {
    document.getElementById('tDealer').value = '';
    document.getElementById('tDescripcion').value = '';
    document.getElementById('tPublicar').checked = true;
    abrirOverlay('modalTicket');
  }
  function guardarTicket() {
    var datos = {
      dealer: document.getElementById('tDealer').value,
      origen: document.getElementById('tOrigen').value,
      tipologia: document.getElementById('tTipologia').value,
      descripcion: document.getElementById('tDescripcion').value,
      publicar: document.getElementById('tPublicar').checked
    };
    if (!datos.dealer.trim()) { toast('Indica el dealer'); return; }
    if (!datos.descripcion.trim()) { toast('Describe el problema'); return; }
    var btn = document.getElementById('btnGuardarTicket');
    btn.disabled = true;
    google.script.run.withSuccessHandler(function (data) {
      btn.disabled = false;
      cerrarOverlay('modalTicket');
      pintar(data);
      toast('Ticket creado ✔');
    }).withFailureHandler(function (e) { btn.disabled = false; error(e); }).crearTicket(datos);
  }

  function abrirMsg(id) {
    var m = DATA.mensajes.filter(function (x) { return String(x['ID']) === String(id); })[0];
    if (!m) return;
    MSG_SEL = id;
    document.getElementById('mMeta').textContent =
      m['Destino'] + ' · ' + (m['Relacionado'] || '') + ' · ' + m['Estado'] +
      (m['Respuestas'] ? ' · ' + m['Respuestas'] : '');
    document.getElementById('mTexto').value = m['Texto (EN)'] || '';
    var btn = document.getElementById('btnEnviarMsg');
    var enviado = m['Estado'] === 'Enviado';
    btn.style.display = enviado ? 'none' : '';
    if (m['Destino'] === 'Gmail (dealer)') btn.textContent = '✉️ Crear borrador en Gmail';
    else if (DATA.slackOk) btn.textContent = '🚀 Enviar a Slack';
    else btn.textContent = '✔ Aprobar (y copiar)';
    abrirOverlay('modalMsg');
  }
  function msgAprobarEnviar() {
    var texto = document.getElementById('mTexto').value;
    if (!texto.trim()) { toast('El mensaje está vacío'); return; }
    var btn = document.getElementById('btnEnviarMsg');
    btn.disabled = true;
    toast('Enviando…');
    google.script.run.withSuccessHandler(function (r) {
      btn.disabled = false;
      cerrarOverlay('modalMsg');
      pintar(r.data);
      if (r.enviado && r.via === 'slack') toast('Enviado a Slack ✔');
      else if (r.enviado && r.via === 'gmail') toast('Borrador creado en Gmail ✉️ — revísalo y envía');
      else { copiarTexto(r.texto); toast('Aprobado y copiado 📋 — pégalo en Slack y marca «Ya lo envié»'); }
    }).withFailureHandler(function (e) { btn.disabled = false; error(e); }).aprobarYEnviarMensaje(MSG_SEL, texto);
  }
  function msgMarcarEnviado() {
    cerrarOverlay('modalMsg');
    llamar('marcarMensajeEnviado', [MSG_SEL], 'Marcado como enviado ✔');
  }

  function abrirResp(id) {
    var t = DATA.tickets.filter(function (x) { return String(x['ID']) === String(id); })[0];
    if (!t) return;
    TICKET_SEL = id;
    document.getElementById('rMeta').textContent =
      t['Dealer'] + ' · ' + t['Tipología'] + ' · #' + t['Canal Slack'] +
      (t['Slack ts'] ? ' (responderá en su thread)' : '');
    document.getElementById('rTexto').value = 'Update on *' + t['Dealer'] + '*: ';
    abrirOverlay('modalResp');
  }
  function guardarRespuesta() {
    var texto = document.getElementById('rTexto').value;
    if (!texto.trim()) { toast('Escribe la respuesta'); return; }
    var btn = document.getElementById('btnGuardarResp');
    btn.disabled = true;
    google.script.run.withSuccessHandler(function (data) {
      btn.disabled = false;
      cerrarOverlay('modalResp');
      pintar(data);
      toast('Respuesta guardada en Mensajes ✉️ — revísala y envíala desde allí');
    }).withFailureHandler(function (e) { btn.disabled = false; error(e); }).responderTicket(TICKET_SEL, texto);
  }

  function estadoTicket(id, estado) { llamar('actualizarTicket', [id, estado, ''], 'Ticket → ' + estado); }
  function notaTicket(id) {
    var nota = prompt('Nota para el ticket:');
    if (nota === null || !nota.trim()) return;
    llamar('actualizarTicket', [id, '', nota.trim()], 'Nota guardada 📝');
  }
  function tareaHecha(id) { llamar('marcarTarea', [id, true], 'Tarea completada ✔'); }

  function copiarTexto(texto) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(function () { toast('Copiado 📋'); }, function () { copiarFallback(texto); });
    } else {
      copiarFallback(texto);
    }
  }
  function copiarFallback(texto) {
    var ta = document.createElement('textarea');
    ta.value = texto;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); toast('Copiado 📋'); }
    catch (e) { toast('No se pudo copiar automáticamente'); }
    document.body.removeChild(ta);
  }

  cargar();
  setInterval(cargar, 5 * 60 * 1000); // refresco automático cada 5 min
</script>
</body>
</html>
